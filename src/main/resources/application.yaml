spring:
  application:
    name: msif

  security:
    jwt:
      secret-key: qrVEBGGghpkc9Ra5L1ELHxm6gisrpgMw
      expiration: 1800000
      refresh-token:
        expiration: 604800000

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        query:
          in_clause_parameter_adding: true

# Datasource: usar variable de entorno SPRING_DATASOURCE_URL/USERNAME/PASSWORD cuando esté disponible.
# Si no se provee, caerá a un H2 en memoria para desarrollo/local.

spring.datasource.url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:localdb;DB_CLOSE_DELAY=-1}
spring.datasource.username: ${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password: ${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Hikari defaults
spring.datasource.hikari.maximum-pool-size: 3
